<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hero texture options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,400&amp;display=swap">
<style>
body{margin:0}
.opt{margin:0;display:flex;flex-direction:column;gap:12px}
.frame{position:relative;aspect-ratio:840 / 527;overflow:hidden;background:#ece5d8}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame svg,.frame .wash{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cap{font-size:13px;line-height:1.5;color:rgba(58,56,53,0.72)}
.cap strong{display:block;font-size:15px;font-weight:600;color:#3a3835;margin-bottom:2px}
</style>
</head><body>

<div style="width: 1440px; height: 820px; box-sizing: border-box; padding: 48px 56px; background: #F3EFE8; color: #3a3835; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; gap: 28px">
<svg aria-hidden="true" style="position: absolute; width: 0; height: 0">
<filter id="tx-micro" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="1" seed="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<filter id="tx-tooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="6" result="n"></feTurbulence><feDiffuseLighting in="n" surfaceScale="0.45" diffuseConstant="1.15" lighting-color="#fffdf8"><feDistantLight azimuth="235" elevation="62"></feDistantLight></feDiffuseLighting><feColorMatrix type="saturate" values="0.2"></feColorMatrix></filter>
<filter id="tx-speck" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="1" seed="12"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0 0.34  5 0 0 0 -3.6"></feColorMatrix></filter>
</svg>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<div>
<div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: rgba(58,56,53,0.68); font-weight: 500">Hero texture</div>
<h1 style="margin: 8px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 36px; letter-spacing: -0.02em">Finer options</h1>
</div>
<p style="margin: 0; max-width: 520px; font-size: 14px; line-height: 1.55; color: rgba(58,56,53,0.72)">The same frame of the hero video with six much finer treatments. These are subtle by design: view at 100% zoom.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 32px">

<figure class="opt"><div class="frame"><img src="assets/hero-still.webp" alt="Hero frame"><svg aria-hidden="true" style="mix-blend-mode: soft-light; opacity: 0.35"><rect width="100%" height="100%" filter="url(#tx-micro)"></rect></svg></div>
<figcaption class="cap"><strong>A · Micro grain, light</strong>Pixel-fine monochrome grain at a whisper. Mostly felt, not seen.</figcaption></figure>

<figure class="opt"><div class="frame"><img src="assets/hero-still.webp" alt="Hero frame"><svg aria-hidden="true" style="mix-blend-mode: soft-light; opacity: 0.6"><rect width="100%" height="100%" filter="url(#tx-micro)"></rect></svg></div>
<figcaption class="cap"><strong>B · Micro grain</strong>The same pixel-fine grain, a little more present.</figcaption></figure>

<figure class="opt"><div class="frame"><img src="assets/hero-still.webp" alt="Hero frame"><svg aria-hidden="true" style="mix-blend-mode: soft-light; opacity: 0.45"><rect width="100%" height="100%" filter="url(#tx-tooth)"></rect></svg></div>
<figcaption class="cap"><strong>C · Fine paper tooth, light</strong>A tiny embossed tooth, like smooth hot-press paper up close.</figcaption></figure>

<figure class="opt"><div class="frame"><img src="assets/hero-still.webp" alt="Hero frame"><svg aria-hidden="true" style="mix-blend-mode: soft-light; opacity: 0.75"><rect width="100%" height="100%" filter="url(#tx-tooth)"></rect></svg></div>
<figcaption class="cap"><strong>D · Fine paper tooth</strong>The same tooth, slightly stronger.</figcaption></figure>

<figure class="opt"><div class="frame"><img src="assets/hero-still.webp" alt="Hero frame"><div class="wash" style="background: rgba(255,253,248,0.08)"></div><svg aria-hidden="true" style="mix-blend-mode: soft-light; opacity: 0.3"><rect width="100%" height="100%" filter="url(#tx-micro)"></rect></svg></div>
<figcaption class="cap"><strong>E · Fine vellum</strong>The faintest frosted lift plus micro grain.</figcaption></figure>

<figure class="opt"><div class="frame"><img src="assets/hero-still.webp" alt="Hero frame"><svg aria-hidden="true" style="mix-blend-mode: multiply; opacity: 0.35"><rect width="100%" height="100%" filter="url(#tx-speck)"></rect></svg></div>
<figcaption class="cap"><strong>F · Micro speckle</strong>Scattered pinpoint flecks, like premium uncoated stock.</figcaption></figure>

</div>
</div>
</body></html>
